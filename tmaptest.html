<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>티맵 연결 시험</title>
<style>body{font-family:sans-serif;padding:16px;line-height:1.5}a{display:block;margin:12px 0;padding:14px;border-radius:10px;background:#1c7ed6;color:#fff;text-decoration:none;font-weight:700}small{display:block;color:#666;word-break:break-all;font-weight:400}</style>
</head><body>
<h3>티맵 연결 시험 (도착지: 서울역)</h3>
<p>버튼을 하나씩 누르고, 티맵에 <b>도착지 '서울역'이 들어가는 번호</b>를 알려 주세요.</p>
<div id="L"></div>
<script>
const n = encodeURIComponent('서울역'), x = 126.9707, y = 37.5547;
const v = [
  ['A', `tmap://route?goalname=${n}&goalx=${x}&goaly=${y}`],
  ['B', `tmap://route?rGoName=${n}&rGoX=${x}&rGoY=${y}`],
  ['C', `tmap://?rGoName=${n}&rGoX=${x}&rGoY=${y}`],
  ['D', `intent://route?goalname=${n}&goalx=${x}&goaly=${y}#Intent;scheme=tmap;package=com.skt.tmap.ku;end`],
  ['E', `tmap://route?goalname=${n}&goalx=${x}&goaly=${y}&reqCoordType=WGS84GEO`],
  ['F', `tmap://search?name=${n}`]
];
document.getElementById('L').innerHTML = v.map(([k, u]) => `<a href="${u}">${k}<small>${u}</small></a>`).join('');
</script>
</body></html>
