<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e44">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="호야맛집">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>호야맛집</title>
<link rel="stylesheet" href="style.css?v=1028b">
<script src="config.js?v=1028b"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="row">
      <button id="btnMode" type="button" class="mode place" aria-label="검색 종류 바꾸기">📍 장소</button>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="가려는 곳 (예: 대전역)">
      <button id="btnSearch" class="icon" aria-label="검색">🔍</button><button id="btnFilter" class="icon" aria-label="필터">⚙</button>
    </div>
    <div class="chips" id="quick"></div>
    <div id="filterPanel" hidden>
      <div class="fp-title">대분류</div>
      <div class="chips wrap" id="catChips"></div>
      <div class="owner-only">
        <div class="fp-title">선호도</div>
        <div class="chips wrap" id="prefChips"></div>
        <div class="fp-title">지역</div>
        <div class="row">
          <select id="sido"><option value="">전체 시도</option></select>
          <select id="sgg"><option value="">전체 시군구</option></select>
        </div>
      </div>
      <div class="fp-title">정렬</div>
      <div class="row">
        <select id="sort">
          <option value="auto">자동 (검색어·위치·선호도 순)</option>
          <option value="dist">가까운 순</option>
          <option value="mine" class="owner-only">내 평점 순</option>
          <option value="friends">지인 평가 순</option>
          <option value="recent" class="owner-only">최근 등록 순</option>
        </select>
        <button id="btnReset">초기화</button>
      </div>
      <button id="fpClose" type="button">▲ 접기</button>
    </div>
  </header>

  <div id="banner" hidden></div>
  <main>
    <div id="map"></div>
    <div id="mapCount"></div>
    <section id="addPanel" hidden></section>
    <section id="listView" hidden>
      <div id="listBar"><span id="count"></span><label class="owner-only"><input type="checkbox" id="inView"> 지도 범위만</label></div>
      <ul id="list"></ul>
      <button id="more" hidden>더 보기</button>
    </section>
  </main>

  <nav id="bottom">
    <button data-view="map" class="on">🗺<span>지도</span></button>
    <button data-view="list">☰<span>목록</span></button>
    <button id="btnLocate">📍<span>내 위치</span></button>
    <button id="btnMenu">🍴<span>메뉴</span></button>
    <button id="btnAdd">＋<span id="addLabel">추가</span></button>
    <button id="btnInbox" class="owner-only">📥<span>건의함</span><b id="inboxBadge" hidden></b></button>
  </nav>

  <div id="sheetBack" hidden></div>
  <section id="sheet" hidden><div class="sheet-head"><div class="grip"></div><button id="sheetX" type="button" aria-label="닫기">✕</button></div><div id="sheetBody"></div></section>
  <div id="toast" hidden></div>
  <div id="gate" hidden></div>
</div>
<script src="app.js?v=1028b"></script>
</body>
</html>
